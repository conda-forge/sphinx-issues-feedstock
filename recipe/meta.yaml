{% set name = "sphinx-issues" %}
{% set version = "6.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name.replace("-", "_") }}/{{ name.replace("-", "_") }}-{{ version }}.tar.gz
  sha256: f40f2c71cecb2068c7f06a53825778b674d58d8395b4ea60551a36164d2988e3

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - flit-core <4
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - sphinx >=8.1.0

test:
  imports:
    - sphinx_issues
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://github.com/sloria/sphinx-issues
  summary: "A Sphinx extension for linking to your project's issue tracker"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/sloria/sphinx-issues

extra:
  recipe-maintainers:
    - asmeurer
    - m-rossi
    - zaneselvans
